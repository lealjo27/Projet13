services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ffe_backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:Z
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthcheck')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ffe_network

networks:
  ffe_network:
    driver: bridge